<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>lp</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <button id="back-btn" class="hidden" aria-label="Back">&larr;</button>
    <button id="brand" title="This release, and updates">
      <img id="brand-icon" src="/release-crucible-and-ruin.png" alt="lp">
      <span id="brand-wordmark">lp</span>
      <span id="brand-release"></span>
    </button>
    <h1 id="header-title" class="hidden"></h1>
    <div class="header-spacer"></div>
    <button id="share-btn" aria-label="Share screenshot">&#x1F4F7;</button>
    <button id="vinyl-btn" aria-label="Vinyl style"><img src="/api/vinyl/preview/spiral-purple" alt=""></button>
  </header>

  <main id="content">
    <div id="artist-controls">
      <input id="search" type="text" placeholder="Search artists..." autocomplete="off">
      <select id="sort">
        <option value="alpha">A–Z</option>
        <option value="recent">Recently played</option>
        <option value="favorites">Favorites</option>
      </select>
    </div>
    <section id="recent-section" class="hidden">
      <h2 class="section-title">Recently played</h2>
      <div id="recent-grid" class="tile-grid"></div>
    </section>
    <div id="artist-grid" class="tile-grid view"></div>
    <div id="album-controls" class="hidden">
      <button id="album-grid-select" aria-label="Choose grid covers" title="Choose grid covers">&#9638;</button>
      <button id="album-sort" aria-label="Toggle year sort order">Year &uarr;</button>
    </div>
    <div id="album-grid" class="tile-grid view hidden"></div>
  </main>

  <footer id="now-playing" class="hidden">
    <div id="np-info">
      <span id="np-track"></span>
      <span id="np-artist-album"></span>
      <button id="np-queue" class="hidden"></button>
    </div>
    <button id="np-stop">Stop</button>
  </footer>

  <!-- The release pill opens this: what is installed, and updates -->
  <div id="release-sheet" class="hidden" role="dialog" aria-modal="true">
    <div id="release-sheet-backdrop"></div>
    <div id="release-sheet-content">
      <div id="release-sheet-head">
        <img id="release-sheet-icon" src="/release-crucible-and-ruin.png" alt="">
        <div>
          <div id="release-sheet-title">lp</div>
          <div id="release-sheet-describe"></div>
        </div>
      </div>
      <div id="release-sheet-status"></div>
      <div id="release-sheet-buttons">
        <button id="update-check">Check for a new release</button>
        <button id="update-now" class="hidden">Install now</button>
        <button id="update-idle" class="hidden">Install after this album</button>
        <button id="update-cancel" class="hidden">Don't restart</button>
        <a id="release-sheet-notes" href="https://github.com/dkoch84/lp/releases" target="_blank" rel="noopener">Release notes on GitHub</a>
        <button id="release-sheet-close" class="sheet-cancel">Close</button>
      </div>
    </div>
  </div>

  <!-- Asked before a tap cuts off the record that is on -->
  <div id="play-sheet" class="hidden" role="dialog" aria-modal="true">
    <div id="play-sheet-backdrop"></div>
    <div id="play-sheet-content">
      <div id="play-sheet-title"></div>
      <div id="play-sheet-buttons">
        <button id="play-sheet-now">Play now</button>
        <button id="play-sheet-next">Play next</button>
        <button id="play-sheet-cancel" class="sheet-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- What is lined up after this record -->
  <div id="queue-sheet" class="hidden" role="dialog" aria-modal="true">
    <div id="queue-sheet-backdrop"></div>
    <div id="queue-sheet-content">
      <div id="queue-sheet-title">Up next</div>
      <ol id="queue-sheet-list"></ol>
      <div id="queue-sheet-buttons">
        <button id="queue-sheet-clear">Clear queue</button>
        <button id="queue-sheet-close" class="sheet-cancel">Close</button>
      </div>
    </div>
  </div>

  <div id="share-modal" class="hidden" role="dialog" aria-modal="true">
    <div id="share-modal-backdrop"></div>
    <div id="share-modal-content">
      <img id="share-modal-img" alt="Captured screenshot">
      <div id="share-modal-actions">
        <a id="share-modal-download" download>Download</a>
        <button id="share-modal-close">Close</button>
      </div>
    </div>
  </div>

  <div id="track-sheet" class="hidden" role="dialog" aria-modal="true">
    <div id="track-sheet-backdrop"></div>
    <div id="track-sheet-content">
      <div id="track-sheet-title"></div>
      <ol id="track-sheet-list"></ol>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
