music_library_path: /path/to/music

# VLC audio output module: alsa (default), pulse, etc. Use pulse on a
# PipeWire/PulseAudio desktop so audio follows your default sink.
# audio_output: alsa

display:
  fullscreen: false
  width: 1920
  height: 1080
  show_metadata: true
  url: https://lp.example.com

api:
  host: 0.0.0.0
  port: 8000

# Self-update (release installs only; a git checkout ignores this). lp checks
# GitHub for a new release every check_hours; with auto on it downloads the
# release and switches to it once the current album has finished. The web UI
# has Check now / Install now / After this album either way.
updates:
  auto: true
  check_hours: 6

lastfm:
  api_key: ""
  api_secret: ""
